name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      - name: Intégrer le plugin et le service mesh dans le projet Android
        run: |
          APPID=$(node -p "require('./capacitor.config.json').appId")
          DIR="android/app/src/main/java/$(echo "$APPID" | tr . /)"
          echo "appId=$APPID  dossier=$DIR"
          mkdir -p "$DIR"
          rm -f "$DIR/MeshPlugin.kt" "$DIR/MainActivity.kt"
          for F in MeshPlugin.java MeshService.java MainActivity.java; do
            sed "s/^package .*/package $APPID;/" "$F" > "$DIR/$F"
          done
          grep -q play-services-nearby android/app/build.gradle || \
            sed -i "0,/^dependencies {/s//dependencies {\n    implementation 'com.google.android.gms:play-services-nearby:19.3.0'/" android/app/build.gradle
          grep -q play-services-nearby android/app/build.gradle || { echo "ERREUR : dépendance Nearby non ajoutée"; exit 1; }
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = [
              ("BLUETOOTH", ' android:maxSdkVersion="30"'),
              ("BLUETOOTH_ADMIN", ' android:maxSdkVersion="30"'),
              ("ACCESS_WIFI_STATE", ""),
              ("CHANGE_WIFI_STATE", ""),
              ("ACCESS_COARSE_LOCATION", ' android:maxSdkVersion="32"'),
              ("ACCESS_FINE_LOCATION", ' android:maxSdkVersion="32"'),
              ("BLUETOOTH_ADVERTISE", ' android:minSdkVersion="31"'),
              ("BLUETOOTH_CONNECT", ' android:minSdkVersion="31"'),
              ("BLUETOOTH_SCAN", ' android:usesPermissionFlags="neverForLocation" android:minSdkVersion="31"'),
              ("NEARBY_WIFI_DEVICES", ' android:usesPermissionFlags="neverForLocation" android:minSdkVersion="32"'),
              ("FOREGROUND_SERVICE", ""),
              ("FOREGROUND_SERVICE_CONNECTED_DEVICE", ""),
              ("POST_NOTIFICATIONS", ""),
              ("REQUEST_IGNORE_BATTERY_OPTIMIZATIONS", ""),
          ]
          add = "".join('    <uses-permission android:name="android.permission.%s"%s/>\n' % (n, a)
                        for n, a in perms if 'android.permission.%s"' % n not in s)
          if add:
              s = s.replace("<application", add + "    <application", 1)
          if "MeshService" not in s:
              s = s.replace("</application>",
                  '        <service android:name=".MeshService" android:exported="false" android:foregroundServiceType="connectedDevice" />\n    </application>', 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: digdag-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
